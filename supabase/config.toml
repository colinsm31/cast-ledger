# Supabase CLI project config.
# Docs: https://supabase.com/docs/guides/cli/config
# `project_id` is a local identifier; you link to a hosted project with
#   supabase link --project-ref <ref>

project_id = "acestock"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Off so an admin can create staff logins without the confirmation-email step
# (and avoids the built-in email rate limit). Turn on for real email flows.
enable_confirmations = false

[analytics]
enabled = false
