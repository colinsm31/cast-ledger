# Supabase CLI project config.
# Docs: https://supabase.com/docs/guides/cli/config
# `project_id` is a local identifier; you link to a hosted project with
#   supabase link --project-ref <ref>

project_id = "acestock"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# No public sign-up: staff accounts are created by admins through the
# create-staff Edge Function (code review #1). Match this in every hosted
# project: Authentication → Sign In / Providers → "Allow new users to sign up" off.
enable_signup = false

[auth.email]
# Keeps the email/password provider on (so staff can sign in). Sign-ups are
# blocked by `enable_signup = false` under [auth] above, not here: this
# setting turns the whole email provider off when false.
enable_signup = true
# Accounts made by create-staff are confirmed on creation, so no email step.
enable_confirmations = false

[functions.create-staff]
# Supabase checks the caller's session before the function runs; the function
# then checks the caller is an admin.
verify_jwt = true

[analytics]
enabled = false

[db.seed]
# Sample tennis-shop catalog for local dev/test (`supabase start` / `db reset`).
# Points straight at the seed file: the CLI runs plain SQL, not psql commands.
enabled = true
sql_paths = ["./seed/tennis_seed.sql"]
